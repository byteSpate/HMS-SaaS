packages:
  - apps/*
  - packages/*

# Exact versions in package.json; the lockfile is authoritative (D1 §4, docs/STACK_VERSIONS.md).
# pnpm's minimumReleaseAge supply-chain check stays on: pick an older release rather than adding exclusions.
savePrefix: ''

# Security floor for transitive dependencies of Express (GHSA-27r3-jxmh-p828 and the qs
# stringify advisory): both ranges allow these versions, but the lockfile held older ones.
# Remove an entry once a direct dependency requires this version or newer.
overrides:
  body-parser: 2.4.0
  qs: 6.16.2

# Only these packages may run install scripts (pnpm blocks all others).
allowBuilds:
  # next-intl's optional watcher is only for its message-extraction CLI, which we do not run.
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  # BullMQ's msgpackr uses prebuilt optional packages and falls back to plain JavaScript.
  msgpackr-extract: false
  prisma: true
