# =====================================================================================
# TEMPLATE — UNTESTED. Production (T0 single VPS) Docker Compose layout. See docs/K-docker-design.md.
# Only YAML syntax was checked during documentation work. Placeholders look like <<…>>.
# Images are referenced by DIGEST (written by the deploy workflow into releases/<sha>.env).
# =====================================================================================
name: hms

x-app-defaults: &app-defaults
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }
  env_file:
    - ./.env            # non-secret settings only (K §7)

services:
  caddy:
    image: caddy:<<PIN 2.x>>@sha256:<<PIN_DIGEST>>
    restart: unless-stopped
    ports:                       # the ONLY published ports on the host (J §5)
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    cap_add: [NET_BIND_SERVICE]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    <<: *app-defaults
    image: ghcr.io/<<ORG>>/hms-web@${WEB_DIGEST:?set by deploy}
    networks: [edge]
    environment:
      API_INTERNAL_URL: http://api:3001        # server-side fetches forward the user's cookie
    mem_limit: 1g
    stop_grace_period: 20s

  api:
    <<: *app-defaults
    image: ghcr.io/<<ORG>>/hms-api@${API_DIGEST:?set by deploy}
    deploy:
      replicas: 2                               # Caddy load-balances and retries during restarts
    networks: [edge, backend]
    secrets: [db_app_password, session_secret, csrf_secret, field_encryption_key, s3_access_key, s3_secret_key]
    environment:
      DB_USER: hms_app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      SESSION_SECRET_FILE: /run/secrets/session_secret
      CSRF_SECRET_FILE: /run/secrets/csrf_secret
      FIELD_ENCRYPTION_KEY_FILE: /run/secrets/field_encryption_key
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 1g
    stop_grace_period: 30s                      # in-flight requests drain (NFR-REL-002)

  worker:
    <<: *app-defaults
    image: ghcr.io/<<ORG>>/hms-worker@${WORKER_DIGEST:?set by deploy}
    networks: [backend, render, egress]         # egress: object storage (and later partner APIs)
    secrets: [db_app_password, db_relay_password, field_encryption_key, s3_access_key, s3_secret_key]
    environment:
      DB_USER: hms_app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      DB_RELAY_USER: hms_relay
      DB_RELAY_PASSWORD_FILE: /run/secrets/db_relay_password
      FIELD_ENCRYPTION_KEY_FILE: /run/secrets/field_encryption_key
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      PDF_RENDERER_URL: http://pdf-renderer:3000
      WORKER_HEALTH_PORT: "9464"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 1536m
    stop_grace_period: 60s                      # worker.close() lets active jobs finish

  pdf-renderer:
    # Headless Chromium HTML→PDF service (ADR-010). Choose the implementation in spike T-PRN-01.
    image: <<PDF_RENDERER_IMAGE e.g. a Gotenberg-style image>>@sha256:<<PIN_DIGEST>>
    restart: unless-stopped
    networks: [render]                          # internal-only network: no internet egress
    mem_limit: 2g
    read_only: false                            # Chromium needs writable dirs; restrict via tmpfs if supported
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  postgres:
    # Custom image = official postgres:18 + pgBackRest (archive_command needs it inside this container)
    image: ghcr.io/<<ORG>>/hms-postgres@${POSTGRES_DIGEST:?set by deploy}
    restart: unless-stopped
    shm_size: 1g
    networks: [backend]
    secrets: [db_superuser_password, db_app_password, db_migrator_password, db_relay_password, db_readonly_password, pgbackrest_cipher_pass, pgbackrest_s3_key, pgbackrest_s3_secret]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      POSTGRES_DB: hms
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql          # PostgreSQL 18 images use a versioned subdirectory; verify the mount path for the pinned image
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hms"]
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  redis:
    # Redis 8 or Valkey (owner decision, P-010 / CX-015). BullMQ requires noeviction + AOF.
    image: <<redis:8.x or valkey/valkey:8.x>>@sha256:<<PIN_DIGEST>>
    restart: unless-stopped
    networks: [backend]
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]   # valkey: valkey-server
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]        # valkey: valkey-cli
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 1g

  migrate:
    # One-off job, run by the deploy script BEFORE recreating app containers (K §8)
    image: ghcr.io/<<ORG>>/hms-migrate@${MIGRATE_DIGEST:?set by deploy}
    profiles: ["migrate"]
    networks: [backend]
    secrets: [db_migrator_password]
    env_file: [./.env]
    environment:
      DB_MIGRATOR_USER: hms_migrator
      DB_MIGRATOR_PASSWORD_FILE: /run/secrets/db_migrator_password
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

networks:
  edge: {}                 # caddy ↔ web/api (api also reaches object storage through this network)
  egress: {}               # worker → object storage / partners
  backend:
    internal: true         # api/worker ↔ postgres/redis; no direct internet
  render:
    internal: true         # worker ↔ pdf-renderer only

# NOTE: postgres, redis and pdf-renderer are attached ONLY to internal networks (no internet).
# api reaches object storage via `edge`; worker via `egress`. A forward proxy with an allow-list
# can replace direct egress if stricter outbound control is required (decide at scaffold).

volumes:
  pgdata: {}
  redisdata: {}
  caddy_data: {}
  caddy_config: {}

secrets:                    # files created by ops under /opt/hms/secrets (0400, root-owned)
  db_superuser_password:  { file: ./secrets/db_superuser_password }
  db_app_password:        { file: ./secrets/db_app_password }
  db_migrator_password:   { file: ./secrets/db_migrator_password }
  db_relay_password:      { file: ./secrets/db_relay_password }
  db_readonly_password:   { file: ./secrets/db_readonly_password }
  session_secret:         { file: ./secrets/session_secret }
  csrf_secret:            { file: ./secrets/csrf_secret }
  field_encryption_key:   { file: ./secrets/field_encryption_key }
  s3_access_key:          { file: ./secrets/s3_access_key }
  s3_secret_key:          { file: ./secrets/s3_secret_key }
  pgbackrest_cipher_pass: { file: ./secrets/pgbackrest_cipher_pass }
  pgbackrest_s3_key:      { file: ./secrets/pgbackrest_s3_key }
  pgbackrest_s3_secret:   { file: ./secrets/pgbackrest_s3_secret }
