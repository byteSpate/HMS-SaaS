# =====================================================================================
# TEMPLATE — UNTESTED. SonarQube Community Build project configuration (C-023).
# Community Build analyses the MAIN branch only; PR quality is enforced by ESLint + SonarJS rules
# and test/coverage checks in ci.yml (ADR-012).
# =====================================================================================
sonar.projectKey=<<org>>_hospital-erp
sonar.projectName=Hospital ERP (SaaS)
sonar.sourceEncoding=UTF-8

# Sources and tests
sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/e2e/**/*.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/generated/**,\
  packages/database/prisma/migrations/**,**/*.d.ts,**/playwright-report/**

# Coverage: LCOV per workspace, generated from the repo root so paths are unique (Sonar JS/TS docs).
# Multiple report paths are comma-separated; verify the exact list produced by the Jest config.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/worker/coverage/lcov.info,apps/web/coverage/lcov.info,\
  packages/mod-patients/coverage/lcov.info,packages/mod-scheduling/coverage/lcov.info,\
  packages/mod-clinical/coverage/lcov.info,packages/mod-billing/coverage/lcov.info,\
  packages/mod-lab/coverage/lcov.info,packages/mod-identity-access/coverage/lcov.info,\
  packages/platform/coverage/lcov.info,packages/domain-kernel/coverage/lcov.info

# Code that is generated, declarative or exercised only by E2E is excluded from coverage (not from analysis)
sonar.coverage.exclusions=**/*.module.ts,**/main.ts,**/*.config.*,packages/contracts/**,\
  packages/i18n/**,packages/ui/**/*.stories.tsx,packages/testkit/**,apps/web/app/**/layout.tsx

# Duplication: ignore generated contract/OpenAPI clients
sonar.cpd.exclusions=**/generated/**,packages/contracts/**

# Quality gate: configure on the server (start from "Sonar way"); see docs/L-cicd-sonarqube.md §4
