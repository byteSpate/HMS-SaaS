# Checks for pull requests and pushes to dev and main (docs/GIT_WORKFLOW.md, L §3).
# Third-party actions are pinned to full commit SHAs; the comment shows the release.
# Image scanning, secret scanning and the SonarQube job are added with T-FND-03 / T-FND-05.
name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17 # same major as Supabase (ADR-019)
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: hms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:9
        ports: ['6379:6379']
    env:
      DATABASE_MIGRATOR_URL: postgresql://hms_migrator:dev_migrator@localhost:5432/hms?schema=hms
      DATABASE_URL: postgresql://hms_app:dev_app@localhost:5432/hms?schema=hms
      VALKEY_URL: redis://localhost:6379/0
      CSRF_SECRET: ci-only-csrf-secret-0123456789abcdef
      MFA_ENCRYPTION_KEY: Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M= # CI only: 32 bytes of 'c'
      CORS_ORIGINS: http://localhost:3100
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create database roles (same script as local dev)
        run: psql "postgresql://postgres:ci-only-password@localhost:5432/hms" -v ON_ERROR_STOP=1 -f docker/postgres/initdb/10-roles.sql
      - run: pnpm db:deploy
      - run: pnpm format:check
      - run: pnpm turbo run build lint typecheck
      - run: pnpm boundaries:check
      - run: pnpm turbo run test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: '**/coverage/lcov.info'
          retention-days: 14

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [checks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hms/web exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@hms/web...
      - run: pnpm --filter @hms/web test:e2e
        env:
          CI: 'true'
      - run: pnpm turbo run build --filter=@hms/site...
      - run: pnpm --filter @hms/site test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/site/playwright-report
          retention-days: 14
